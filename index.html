          if (h === '/parents') return 'parents';
          return 'home';
        });
        var page = pageState[0];
        var setPage = pageState[1];

        useEffect(function () {
          var handler = function () {
            var h = window.location.hash.slice(1);
            if (h === '/about') setPage('about');
            else if (h === '/parents') setPage('parents');
            else setPage('home');
          };
          window.addEventListener('hashchange', handler);
          return function () {
            window.removeEventListener('hashchange', handler);
          };
        }, []);

        useEffect(function () {
          var nextHash = page === 'about' ? '#/about' : page === 'parents' ? '#/parents' : '#/';
          if (window.location.hash !== nextHash) {
            window.location.hash = nextHash;
          }
          document.title = (page === 'about' ? 'About | ' : page === 'parents' ? 'For parents | ' : '') + 'Joe Markland | Career coach in Lancashire and online';
        }, [page]);

        return e('div', {
          style: {
            fontFamily: F.sans,
            color: C.ink,
            background: C.sand,
            lineHeight: 1.78,
            minHeight: '100vh'
          }
        },
          e('a', { className: 'skip-link', href: '#/', onClick: function (ev) { ev.preventDefault(); var m = document.getElementById('main'); if (m) m.focus(); } }, 'Skip to content'),
          e(Nav, { page: page, setPage: setPage }),
          e('div', { id: 'main', tabIndex: -1, style: { outline: 'none' } },
            page === 'about' ? e(AboutPage, { setPage: setPage }) : page === 'parents' ? e(ParentsPage, { setPage: setPage }) : e(HomePage, { setPage: setPage })
          ),
          e(Footer, { setPage: setPage, wide: page === 'home' })
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(e(App));
    })();
  </script>
</body>
</html>
